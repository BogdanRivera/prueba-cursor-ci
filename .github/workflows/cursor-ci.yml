# GitHub Actions workflow for Cursor branches (prefix cursor/)
# Runs tests on push to any branch starting with 'cursor/'
# This offloads work from Travis CI

name: Cursor CI

on:
  push:
    branches:
      - 'cursor/**'   # Only branches like cursor/fix-weekly-calendar

jobs:
  test:
    runs-on: ubuntu-22.04

    # Helper services (PostgreSQL and Redis) as Docker containers
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # Allow local connections without password
          POSTGRES_USER: postgres
          POSTGRES_DB: travis_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Global environment variables
    env:
      PGPORT: 5432
      PGUSER: travis
      PGPASSWORD: password
      RAILS_ENV: test

    # Matrix of parallel jobs (replicates Travis jobs.include)
    strategy:
      fail-fast: false   # Continue other jobs even if one fails
      matrix:
        include:
          - spec_folder: 'spec/system'
            exclude: 'spec/system/{review_generation,feedback_tool}/**/*_spec.rb'
            percy: 'true'
            run_lint: 'false'
          - spec_folder: 'spec/system/review_generation'
            exclude: 'dummy'
            percy: 'false'
            run_lint: 'true'
          - spec_folder: 'spec/system/feedback_tool'
            exclude: 'spec/system/feedback_tool/survey_builder/*_spec.rb'
            percy: 'false'
            run_lint: 'false'
          - spec_folder: 'spec/system/feedback_tool/survey_builder'
            exclude: 'dummy'
            percy: 'false'
            run_lint: 'false'
          - spec_folder: 'spec'
            exclude: 'spec/system/**/*_spec.rb'
            percy: 'false'
            run_lint: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Set up Ruby 3.1.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.6
          bundler: '< 2'
          bundler-cache: true

      - name: Set up Node.js 12.18.4
        uses: actions/setup-node@v4
        with:
          node-version: '12.18.4'
          cache: 'yarn'

      - name: Install system packages (xclip, Chrome, PostgreSQL client, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip google-chrome-stable postgresql-client-14 xvfb

      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Create 'travis' user in PostgreSQL
        run: |
          psql -h localhost -U postgres -c "CREATE USER travis WITH SUPERUSER PASSWORD 'password';"
        env:
          PGPASSWORD: ''   # No password needed because of trust auth

      - name: Prepare test databases (pos:create, schema:load, test:prepare)
        run: |
          bundle exec rake db:pos:create db:pos:schema:load db:pos:test:prepare
          bundle exec rake db:test:prepare

      - name: Install JavaScript dependencies with Yarn
        run: yarn install --frozen-lockfile

      - name: Precompile assets for test environment
        run: RAILS_ENV=test bin/rails assets:precompile &> /dev/null

      - name: Run linter (if enabled) and execute tests
        run: |
          if [[ "${{ matrix.run_lint }}" == "true" ]]; then
            ./bin/lint.sh
          fi
          ./bin/run_tests.sh
        env:
          SPEC_FOLDER: ${{ matrix.spec_folder }}
          EXCLUDE: ${{ matrix.exclude }}
          PERCY: ${{ matrix.percy }}
          # If you need a Percy token, uncomment and add the secret in GitHub:
          # PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.spec_folder }}
          path: tmp/screenshots/
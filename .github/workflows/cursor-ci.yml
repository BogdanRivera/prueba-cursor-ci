# .github/workflows/cursor-ci.yml
name: Cursor Branch CI

on:
  push:
    branches:
      - 'cursor/**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    if: startsWith(github.head_ref, 'cursor/') || startsWith(github.ref_name, 'cursor/')
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: travis
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPORT: 5432
      PGUSER: travis
      PGPASSWORD: password
      RAILS_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - spec_folder: 'spec/system'
            exclude: 'spec/system/{review_generation,feedback_tool}/**/*_spec.rb'
            percy: 'true'
          - spec_folder: 'spec/system/review_generation'
            exclude: 'dummy'
            run_lint: 'true'
          - spec_folder: 'spec/system/feedback_tool'
            exclude: 'spec/system/feedback_tool/survey_builder/*_spec.rb'
          - spec_folder: 'spec/system/feedback_tool/survey_builder'
            exclude: 'dummy'
          - spec_folder: 'spec'
            exclude: 'spec/system/**/*_spec.rb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Setup Ruby 3.1.6
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.6'
          bundler-cache: true
        env:
          BUNDLE_WITHOUT: 'development:production'

      - name: Setup Node v12.18.4
        uses: actions/setup-node@v4
        with:
          node-version: '12.18.4'
          cache: 'yarn'

      - name: Install Yarn dependencies
        run: yarn install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Cache webdrivers
        uses: actions/cache@v4
        with:
          path: .webdrivers
          key: webdrivers-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}

      - name: Setup databases
        run: |
          bundle exec rake db:pos:create db:pos:schema:load db:pos:test:prepare
          bundle exec rake db:test:prepare

      - name: Precompile assets
        #run: bin/rails assets:precompile
        run: echo "Assets precompile skipped"
        
      - name: Run lint
        if: matrix.run_lint == 'true'
        run: ./bin/lint.sh

      - name: Run tests
        env:
          SPEC_FOLDER: ${{ matrix.spec_folder }}
          EXCLUDE: ${{ matrix.exclude }}
          PERCY: ${{ matrix.percy }}
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          ./bin/run_tests.sh